# SonarQube — GY Accounts dashboard
sonar.projectKey=gy-accounts
sonar.projectName=[FRONT] GY Accounts
sonar.projectVersion=1.0

sonar.sources=src
sonar.sourceEncoding=UTF-8
sonar.exclusions=**/*.test.ts,**/*.test.tsx,src/test-utils/**,**/*.d.ts,**/node_modules/**,**/coverage/**

sonar.tests=src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx

# Generated by `npm run test:coverage` (jest.config.js: lcov).
sonar.javascript.lcov.reportPaths=coverage/lcov.info
